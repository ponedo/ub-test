<text x="34" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold">CS+MC: actual envelope coverage by graph role</text>
<text x="34" y="63" font-family="Arial,sans-serif" font-size="13">Member payload carried in envelopes, not fraction of source packets or theoretical group eligibility.</text>
<text x="30" y="127" font-family="Arial,sans-serif" font-size="15">Stage I chunks</text><rect x="210" y="110" width="580" height="27" fill="#e7edf4"/><rect x="210" y="110" width="33.040" height="27" fill="#6c4fb3"/><text x="805" y="129" font-family="Arial,sans-serif" font-size="15">5.697%</text><text x="210" y="155" font-family="Arial,sans-serif" font-size="13">1,050 envelopes; 512/4,608 groups merged at least once</text>
<text x="30" y="192" font-family="Arial,sans-serif" font-size="15">Stage II chunks</text><rect x="210" y="175" width="580" height="27" fill="#e7edf4"/><rect x="210" y="175" width="11.412" height="27" fill="#6c4fb3"/><text x="805" y="194" font-family="Arial,sans-serif" font-size="15">1.968%</text><text x="210" y="220" font-family="Arial,sans-serif" font-size="13">544 envelopes; 165/9,216 groups merged at least once</text>
<text x="30" y="257" font-family="Arial,sans-serif" font-size="15">Whole-expert groups</text><rect x="210" y="240" width="580" height="27" fill="#e7edf4"/><rect x="210" y="240" width="234.361" height="27" fill="#6c4fb3"/><text x="805" y="259" font-family="Arial,sans-serif" font-size="15">40.407%</text><text x="210" y="285" font-family="Arial,sans-serif" font-size="13">142,650 envelopes; 17/20 groups merged at least once</text>
<text x="30" y="330" font-family="Arial,sans-serif" font-size="13">The remaining member payload used immediate original native unicast. No synchronization was added.</text></svg>
